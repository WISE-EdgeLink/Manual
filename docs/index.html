<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>EdgeLink Docs</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">
    <style>
        .selectors {
            position: fixed;
            top: 10px;
            right: 20px;
            background: white;
            padding: 10px;
            border-radius: 4px;
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
            z-index: 1000;
        }
        .selectors select {
            margin: 0 5px;
            padding: 4px;
        }
        .loading {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            background: rgba(255,255,255,.9);
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 2px 10px rgba(0,0,0,.2);
            z-index: 1001;
        }
        .version-hint {
            position: fixed;
            top: 50px;
            right: 20px;
            background: #f8f9fa;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 12px;
            color: #666;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">加载中...</div>
    <div class="version-hint" id="versionHint" style="display: none;">
        当前版本: <span id="currentVersion"></span>
    </div>

    <div class="selectors">
        <select id="version"></select>
        <select id="language"></select>
    </div>
    <div id="app"></div>

    <script>
    /**************** 配置 ****************/
    const CONFIG = {
        latestVersion: 'v2.8.4.5',
        defaultLanguage: 'zh-CN',
        repoName: 'Manual',
        versions: ['latest', 'v2.8.4.5', 'v2.8.3.5'],
        languages: [{val: 'zh-CN', name: '中文'}, {val: 'en-US', name: 'English'}]
    };

    /**************** 工具 ****************/
    const $ = s => document.querySelector(s);
    function showLoading() { $('#loading').style.display = 'block'; }
    function hideLoading() { $('#loading').style.display = 'none'; }
    function showVersionHint(v) {
        $('#currentVersion').textContent = v;
        $('#versionHint').style.display = 'block';
    }
    function hideVersionHint() { $('#versionHint').style.display = 'none'; }

    /**************** 解析 hash ****************/
    function parseHash() {
        const parts = (window.location.hash || '#/latest/zh-CN/')
                      .replace(/^#\//, '').replace(/\/$/, '').split('/').filter(Boolean);

        let ver = 'latest', lang = CONFIG.defaultLanguage;
        if (parts.length >= 2) {
            ver = parts[0]; lang = parts[1];
        } else if (parts.length === 1) {
            if (CONFIG.languages.map(l=>l.val).includes(parts[0])) lang = parts[0];
            else ver = parts[0];
        }
        return {
            displayVersion: ver,
            actualVersion: ver === 'latest' ? CONFIG.latestVersion : ver,
            language: lang
        };
    }

    /**************** 构建下拉 ****************/
    function fillSelectors() {
        const vSel = $('#version'), lSel = $('#language');
        vSel.innerHTML = CONFIG.versions.map(v =>
            `<option value="${v}">${v === 'latest' ? '最新版本' : v}</option>`).join('');
        lSel.innerHTML = CONFIG.languages.map(l =>
            `<option value="${l.val}">${l.name}</option>`).join('');
    }

    /**************** 切换 ****************/
    function switchVersionLang() {
        showLoading();
        const ver = $('#version').value, lang = $('#language').value;
        const url = `/#/${ver}/${lang}/`;
        setTimeout(() => { window.location.href = url; }, 100);
    }

    /**************** 初始化 Docsify ****************/
    function initDocsify(lang) {
        window.$docsify = {
            name: 'EdgeLink Documentation',
            repo: '',
            routerMode: 'hash',
            loadSidebar: true,
            subMaxLevel: 2,
            auto2top: true,
            homepage: 'README.md',
            loadSidebar: '_sidebar.md',
            notFoundPage: 'README.md',
            search: {
                depth: 3,
                placeholder: lang === 'zh-CN' ? '搜索' : 'Search'
            },
            alias: {
                '/.*/_sidebar.md': '/_sidebar.md'
            }
        };
    }

    /**************** 主入口 ****************/
    document.addEventListener('DOMContentLoaded', () => {
        showLoading();
        try {
            fillSelectors();
            const {displayVersion, actualVersion, language} = parseHash();

            $('#version').value = displayVersion;
            $('#language').value = language;
            if (displayVersion !== 'latest') showVersionHint(actualVersion);

            initDocsify(language);
            $('#version').addEventListener('change', switchVersionLang);
            $('#language').addEventListener('change', switchVersionLang);
        } catch (e) { console.error(e); }
        setTimeout(hideLoading, 300);
    });

    window.addEventListener('docsify-ready', hideLoading);
    </script>

    <!-- 加载 Docsify -->
    <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
